# Cloudflare Worker config for the Extras backend.
#
# Deliberately has NO account_id and NO secrets. The owner's Cloudflare account is
# picked at `wrangler login` time, and every secret is set with `wrangler secret put`
# (see README.md). Plain, non-secret settings live under [vars] below.

name = "localintelligence-extras"
main = "src/index.ts"
# `@cloudflare/playwright` and Stagehand require `nodejs_compat` and compatibility_date >= 2025-09-15:
# https://developers.cloudflare.com/browser-run/stagehand/#2-configure-your-worker
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[alias]
playwright = "@cloudflare/playwright"

[[d1_databases]]
binding = "DB"
database_name = "localintelligence-extras"
# TODO(owner): replace with the database_id printed by `wrangler d1 create localintelligence-extras`.
# Deploy fails until this is set to the real id.
database_id = "TODO-OWNER-D1-DATABASE-ID"

# Cloudflare Sandbox 1.0 Durable Object and container configuration (W1).
# Docs: https://developers.cloudflare.com/sandbox/sdk/migrate/replace-the-sandbox-class/
[[containers]]
class_name = "Sandbox"
name = "localintelligence-extras-sandbox"
scheduling_policy = "durable_object"

[containers.images.sandbox]
dockerfile = "./Dockerfile"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

# Cloudflare Browser Rendering + BrowserTask Durable Object (W2).
# Docs: https://developers.cloudflare.com/browser-run/stagehand/
[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "BROWSER_TASK"
class_name = "BrowserTask"

[[migrations]]
tag = "v1-browser-task"
new_sqlite_classes = ["BrowserTask"]

# Uncommented by the mail service job (W5) to enable Cloudflare Email Sending.
# [[send_email]]
# name = "SEND_EMAIL"

[vars]
# The Android applicationId. Requests for any other package are refused.
PACKAGE_NAME = "dev.localintelligence.app"
# The only Play subscription product this Worker provisions for.
PRODUCT_ID = "extras_monthly"
# Chat model handed to the phone. Same suggested id the app uses for OpenRouter.
DEFAULT_MODEL = "google/gemini-2.5-flash"
# Per-customer OpenRouter key: monthly USD cap, reset monthly by OpenRouter (limit_reset: monthly).
# TODO(owner): confirm the cap; the research note assumes 3.50.
OPENROUTER_MONTHLY_LIMIT_USD = "3.50"
# Per-customer Exa key: requests per second, and budget in cents for the team's billing period.
# TODO(owner): confirm both; these are not in the research note.
EXA_RATE_LIMIT_RPS = "5"
EXA_BUDGET_CENTS = "150"
# Pub/Sub push OIDC check (src/pubsub-auth.ts). Set both to the values of the push subscription:
# the audience you enter for it, and the service account it signs as. While a value is still a
# TODO placeholder, or empty, every push is refused with 401.
# TODO(owner): audience, e.g. the push endpoint URL https://<worker URL>/v1/rtdn/<RTDN_PATH_SECRET>
PUBSUB_AUDIENCE = "TODO-OWNER-PUBSUB-AUDIENCE"
# TODO(owner): the service account email used for the push subscription's OIDC identity.
PUBSUB_SERVICE_ACCOUNT_EMAIL = "TODO-OWNER-PUBSUB-SERVICE-ACCOUNT-EMAIL"

# Wave-2 managed services: monthly per-customer caps (all TODO(owner) to confirm) and non-secret vars.
# A service stays off until all of its bindings, secrets and non-empty vars are configured.
SANDBOX_MINUTES_CAP = "120"
BROWSER_MINUTES_CAP = "60"
COMPOSIO_CALLS_CAP = "500"
DEEPGRAM_PROJECT_ID = ""
VOICE_STT_MINUTES_CAP = "60"
VOICE_TTS_CHARS_CAP = "20000"
EMAIL_DOMAIN = ""
MAIL_SENDS_CAP = "100"
TELEGRAM_BOT_USERNAME = ""
