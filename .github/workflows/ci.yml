name: ci

# Three of these jobs are fast enough to gate every push, and the expensive one
# is not. That split is the whole design:
#
#   policy       — greps only. No JDK, no Gradle, no Android SDK. ~10 seconds.
#   core         — :core is pure JVM, so tests + evals + API freeze. ~2 minutes.
#   android-jvm  — :android unit tests, no native build. ~1 minute.
#   apk          — llama.cpp cross-compiled for two ABIs. 10+ min. Nightly only.
#
# A CI run that takes twenty minutes trains a swarm to ignore CI, and once CI is
# ignored every gate in scripts/ is decoration. See docs/CI.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast gates. A few greps over files already in the checkout, so an
  # architecture violation is reported almost immediately rather than after a
  # build finishes.
  policy:
    name: policy (architecture, deps, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rule: ":core is pure Kotlin/JVM — zero android.* types".
      - name: :core must not touch Android
        run: ./scripts/check-core-purity.sh

      # Rule: "no new dependency without a reviewed justification",
      # and "no cloud, no telemetry, no MCP".
      - name: dependency policy
        run: ./scripts/check-dependencies.sh

      # Rule: "no secrets, no committed model files, no committed APKs".
      - name: repository hygiene
        run: ./scripts/check-repo-hygiene.sh

      # Rule: "formatting consistency across agents".
      - name: formatting
        run: ./scripts/check-formatting.sh

  # ---------------------------------------------------------------------------
  # The brain. :core is pure JVM on purpose, so the entire agent — loop, tool
  # selection, loop detection, context building, memory, and the full eval suite
  # — is verified in seconds with no emulator and no device.
  core:
    name: core (JVM tests + evals + API freeze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The architecture's central claim, enforced rather than documented.
      # Duplicated from the policy job on purpose: this job stays self-contained
      # and fails for the right reason in isolation.
      - name: Verify :core has no Android dependencies
        run: ./scripts/check-core-purity.sh

      - name: Test
        run: ./gradlew :core:test --stacktrace

      # Rule: "the eval suite must report its score" and "a regression in score
      # fails the build". Wired against the REAL AgentController, not a
      # reference double. This also fails when the harness reports no score at
      # all, which a bare `:core:evals` invocation would call green.
      - name: Eval suite + regression gate
        run: ./scripts/check-evals.sh

      # Rule: "interfaces in :core are FROZEN". Regenerates the public API dump
      # and fails if it moved; prints the diff for the reviewer.
      - name: Frozen :core public API
        run: ./scripts/check-api-freeze.sh

      # Rule: "no cloud / no telemetry" — against the RESOLVED tree, not the
      # declared one, so a transitive dependency cannot smuggle a forbidden SDK
      # past the allowlist.
      - name: Resolved dependency tree is clean
        run: |
          ./gradlew :core:dependencies :android:dependencies :app:dependencies \
            --configuration releaseRuntimeClasspath -q > /tmp/deps.txt 2>&1 || true
          if grep -inE 'firebase|crashlytics|sentry|amplitude|mixpanel|segment|appcenter|posthog|datadog|newrelic|bugsnag|amazonaws|software\.amazon|com\.google\.cloud|azure|modelcontextprotocol|jitpack|langchain|llamaindex|openai|anthropic' /tmp/deps.txt; then
            echo "::error::A forbidden (cloud / telemetry / MCP) dependency appears in the resolved graph"
            exit 1
          fi
          echo "resolved-dependency-policy: OK"

  # ---------------------------------------------------------------------------
  # The JVM half of :android. Split out from the APK build so that a broken tool
  # implementation fails in ~1 minute rather than after a 10-minute native
  # cross-compile.
  android-jvm:
    name: android (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default is 'tools platform-tools', and Google removed
          # the legacy `tools` package from the SDK repository — so the default
          # makes sdkmanager exit 1 and the job dies inside the action, before
          # any of our steps run. Name the packages we actually want instead.
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licences
        # Without this, setup-android leaves the SDK unusable and the job dies
        # in sdkmanager with an opaque licence error before Gradle ever runs.
        run: sdkmanager --licenses <<< $'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' || true

      - name: Test :android
        # Unit tests only. The native library is not needed for these, and
        # building it would add ~10 minutes for no extra signal.
        run: ./gradlew :android:test --stacktrace
