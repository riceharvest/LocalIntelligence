name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # :core is pure JVM on purpose, so the entire brain of the agent - loop,
  # tool selection, loop detection, context building, memory, and the full
  # eval suite - is verified in seconds with no emulator and no device.
  #
  # This is the job that gates every push. It is fast on purpose: a CI that
  # takes 20 minutes trains people to ignore it.
  # ---------------------------------------------------------------------
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify :core has no Android dependencies
        # The architecture's central claim, enforced rather than documented.
        run: |
          if grep -rn "import android\." core/src/ ; then
            echo "::error:::core must stay a pure JVM module — found an android.* import"
            exit 1
          fi
          if grep -rn "com.android" core/build.gradle.kts ; then
            echo "::error:::core must not apply the Android plugin"
            exit 1
          fi

      - name: Test
        run: ./gradlew :core:test --stacktrace

      - name: Agent eval suite (fakes)
        # Wired against the REAL AgentController, not a reference double.
        run: ./gradlew :core:evals

  # ---------------------------------------------------------------------
  # The JVM half of :android. Split out from the APK build so that a broken
  # tool implementation fails in ~1 minute rather than after a 10-minute
  # native cross-compile.
  # ---------------------------------------------------------------------
  android-jvm:
    name: android (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licences
        # Without this, setup-android leaves the SDK unusable and the job dies
        # in sdkmanager with an opaque licence error before Gradle ever runs.
        run: sdkmanager --licenses <<< $'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' || true

      - name: Test :android
        # Unit tests only. The native library is not needed for these, and
        # building it would add ~10 minutes for no extra signal.
        run: ./gradlew :android:test --stacktrace

  # ---------------------------------------------------------------------
  # The real APK, including the llama.cpp JNI cross-compile.
  #
  # Slow (10+ min cold) and it needs ~2 GB of disk for android/.cxx, so it
  # runs on pushes to main and on pull_request, but agents should expect to
  # iterate against `core` and `android-jvm` instead of waiting on this.
  # ---------------------------------------------------------------------
  apk:
    name: android + app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licences
        run: sdkmanager --licenses <<< $'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' || true

      - name: Install NDK and CMake
        # :android builds a native JNI library, which needs both. Pinning the
        # versions the CMakeLists.txt declares keeps the build reproducible.
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.1"

      - name: Build debug APK
        # PIDROID_LLAMA_FETCH makes CMake pull the pinned llama.cpp tag via
        # FetchContent instead of requiring a submodule checkout. Without it
        # the configure step fails naming the fix, which is the intended
        # behaviour locally but is just a broken CI job here.
        env:
          PIDROID_LLAMA_FETCH: '1'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalIntelligence-debug
          path: app/build/outputs/apk/debug/*.apk
